<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#253537" />
		<meta name="description" content="Schlüsselbilder aus Redstone im Flatdesign-Grafiknovelstil." />
		<title>Galerie – Luzz Biteyear: Legend of Redstone</title>
		<link rel="icon" href="../medien/grafiken/Bildmarke farbig.svg" type="image/svg" />
		<link rel="stylesheet" href="../gestaltung/grundlayout.css" />
		<script src="../funktion/galerie.js" defer></script>
	</head>

	<body id="Galerieseite" class="galerieseite">

		<header id="Kopfbereich">
			<a href="start.html" aria-label="Zur Startseite">
				<img src="../medien/grafiken/Bildmarke farbig.svg" alt="Luzz Biteyear" />
			</a>

			<button id="Menueicon" class="Icon" type="button" aria-label="Navigation anzeigen">&#xf20d;</button>

			<nav id="Navleiste" aria-label="Hauptnavigation">
				<a href="start.html">Start</a>
				<a href="charaktere.html">Luzz &amp; Co</a>
				<a href="spiel.html">Das Spiel</a>
				<a href="galerie.html" aria-current="page">Galerie</a>
				<a href="merchandise.html">Merchandise</a>
			</nav>
		</header>

		<main id="Hauptinhalt">

			<a class="zurueck" href="start.html">&#8592; Zurück zur Startseite</a>

			<header class="seitentafel">
				<p class="kapitelmarke">Einblicke in Redstone</p>
				<h1>Galerie</h1>
				<p>Entdecke Redstone, seine Schauplätze und die Welt von Luzz Biteyear.</p>
			</header>

			<section class="galerie-slider" aria-label="Schlüsselbilder der Landingpage">

				<section class="galerie-anzeige" aria-label="Große Bilderansicht">

					<button class="galerie-zurueck" type="button" aria-label="Vorheriges Bild">
						&#10094;
					</button>

					<figure class="galerie-hauptbild">
						<img
							src="../medien/bilder/landingpage/keyframe-01.png"
							alt="Luzz zielt in Redstone">
					</figure>

					<button class="galerie-weiter" type="button" aria-label="Nächstes Bild">
						&#10095;
					</button>

				</section>

				<section class="galerie-vorschau" aria-label="Bildauswahl">

					<button type="button" aria-label="Bild 1 anzeigen">
						<img src="../medien/bilder/galerie/stadt_3d_a.png" alt="Luzz in der 3D-Stadt Redstone">
					</button>

					<button type="button" aria-label="Bild 2 anzeigen">
						<img src="../medien/bilder/galerie/stadt_3d_b.png" alt="Stadtansicht von Redstone anzeigen">
					</button>

					<button type="button" aria-label="Bild 3 anzeigen">
						<img src="../medien/bilder/galerie/wanted-schild.png." alt="Wanted-Plakat von Luzz Biteyear">
					</button>

					<button type="button" aria-label="Bild 4 anzeigen">
						<img src="../medien/bilder/galerie/geist.jpg" alt="Geist aus dem Spiel">
					</button>

					<button type="button" aria-label="Bild 5 anzeigen">
						<img src="../medien/bilder/galerie/Ingame.png" alt="Ingame-Szene aus Redstone">
					</button>

					<button type="button" aria-label="Bild 6 anzeigen">
						<img src="../medien/bilder/galerie/fotografie.jpg" alt="Fotografie von Luzz und seiner Schwester Lucy">
					</button>

					<button type="button" aria-label="Bild 7 anzeigen">
						<img src="../medien/bilder/galerie/falltuer.jpeg" alt="Mechanismus Falltür">
					</button>

					<button type="button" aria-label="Bild 8 anzeigen">
						<img src="../medien/bilder/galerie/schienen.jpeg" alt="Mechanismus Bahnschienen">
					</button>

					<button type="button" aria-label="Bild 9 anzeigen">
						<img src="../medien/bilder/galerie/inventar.jpg" alt="Inventaransicht des Spiels">
					</button>

				</section>

			</section>

		</main>

		<footer id="Fussbereich">
			<p>&copy; 2026 Luzz Biteyear</p>
			<a href="impressum.html">Impressum</a>
		</footer>

	</body>
</html>
